name: kaeru

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: kaeru
      POSTGRES_USER: kaeru
      POSTGRES_PASSWORD: kaeru_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    shm_size: 128mb
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U kaeru -d kaeru
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
